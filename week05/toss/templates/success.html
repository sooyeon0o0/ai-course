<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 성공</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; max-width: 600px; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        h1 { color: #0064ff; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🎉 결제 성공!</h1>
    <p>결제 결과 상세 정보:</p>
    <table>
        <thead>
            <tr>
                <th>항목</th>
                <th>값</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>status</td>
                <td>{{ result.status }}</td>
            </tr>
            <tr>
                <td>orderName</td>
                <td>{{ result.orderName }}</td>
            </tr>
            <tr>
                <td>totalAmount</td>
                <td>{{ result.totalAmount }}</td>
            </tr>
            <tr>
                <td>method</td>
                <td>{{ result.method }}</td>
            </tr>
            <tr>
                <td>approvedAt</td>
                <td>{{ result.approvedAt }}</td>
            </tr>
        </tbody>
    </table>

    <h3>원본 JSON 응답:</h3>
    <pre>{{ raw_json | tojson(indent=2) }}</pre>
</body>
</html>
