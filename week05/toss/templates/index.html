<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토스페이먼츠 주문서형 결제 테스트</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #payment-method { margin-bottom: 20px; border: 1px solid #eee; padding: 10px; width: 100%; max-width: 400px; }
        #agreement { margin-bottom: 20px; width: 100%; max-width: 400px; }
        button { padding: 15px 30px; font-size: 16px; cursor: pointer; background-color: #0064ff; color: white; border: none; border-radius: 8px; width: 100%; max-width: 400px; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>결제 테스트</h1>
    <div id="payment-method"></div>
    <div id="agreement"></div>
    <button id="payment-button" disabled>결제하기</button>

    <script>
        const clientKey = 'test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm';
        const customerKey = TossPayments.ANONYMOUS;

        const tossPayments = TossPayments(clientKey);
        const widgets = tossPayments.widgets({ customerKey });

        widgets.setAmount({
            currency: 'KRW',
            value: 1000,
        });

        widgets.renderPaymentMethods({
            selector: '#payment-method',
            variantKey: 'DEFAULT',
        });

        widgets.renderAgreement({
            selector: '#agreement',
            variantKey: 'AGREEMENT',
        }).then((agreementWidget) => {
            agreementWidget.on('agreementStatusChange', (agreementStatus) => {
                const paymentButton = document.getElementById('payment-button');
                paymentButton.disabled = !agreementStatus.agreedRequiredTerms;
            });
        });

        document.getElementById('payment-button').addEventListener('click', async () => {
            try {
                await widgets.requestPayment({
                    orderId: Math.random().toString(36).substring(2, 11),
                    orderName: '테스트 상품',
                    successUrl: window.location.origin + '/success',
                    failUrl: window.location.origin + '/fail',
                });
            } catch (error) {
                console.error('결제 요청 실패:', error);
            }
        });
    </script>
</body>
</html>
